name: Publish to NuGet

# The package version comes from the release tag (vX.Y.Z or vX.Y.Z-suffix), not the .csproj.
# Manual runs build, test, and pack a throwaway 0.0.0-ci.N version but never push.
on:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_FILE: src/ImgForge/ImgForge.csproj
  PACK_OUTPUT: artifacts/package/release

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version from tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$TAG_NAME"
          else
            TAG="v0.0.0-ci.$RUN_NUMBER"
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid SemVer version (expected vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          echo "Publishing version $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release-notes=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      # Version is passed to build (not just pack) so the assemblies inside the package match it.
      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack "${{ env.PROJECT_FILE }}" --configuration Release --no-build
          --output "${{ env.PACK_OUTPUT }}"
          -p:Version=${{ steps.version.outputs.value }}
          "-p:PackageReleaseNotes=${{ steps.version.outputs.release-notes }}"

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name != '' }}
        shell: pwsh
        run: |
          Get-ChildItem "${{ env.PACK_OUTPUT }}" -Filter *.nupkg |
          ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json
          }
